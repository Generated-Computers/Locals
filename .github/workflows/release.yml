name: release

# Publishes Locals to PyPI when a version tag such as v0.2.0 is pushed, and to
# TestPyPI when started by hand from the Actions tab ("Run workflow"). PyPI trusts
# this workflow itself (trusted publishing), so no password or token is stored
# anywhere: on pypi.org the project has a trusted publisher for the repository
# Generated-Computers/Locals, workflow release.yml, environment pypi, and on
# test.pypi.org the same with environment testpypi. RELEASING.md has the steps.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  build:
    needs: tests
    # the package is pure Python: building it needs no Mac
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: The tag, the package and the changelog agree on the version
        run: |
          v=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          echo "version $v"
          grep -q "^__version__ = \"$v\"" locals/__init__.py \
            || { echo "::error::locals/__init__.py has another __version__ than pyproject.toml ($v)"; exit 1; }
          grep -q "^## $v " CHANGELOG.md \
            || { echo "::error::CHANGELOG.md has no '## $v (date)' entry"; exit 1; }
          # a trial run for TestPyPI may come before the date is set; a release may not
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            [ "$GITHUB_REF_NAME" = "v$v" ] \
              || { echo "::error::the tag is $GITHUB_REF_NAME but the package version is $v"; exit 1; }
            if grep -q "^## $v (unreleased)" CHANGELOG.md; then
              echo "::error::CHANGELOG.md still calls $v unreleased; put the release date there"; exit 1
            fi
          fi
      - name: Build the wheel and the source archive
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist/

  testpypi:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/locals
    permissions:
      id-token: write  # trusted publishing
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true  # a second trial of the same version is not an error

  pypi:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/locals
    permissions:
      id-token: write  # trusted publishing
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
