name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:  # the release workflow runs these tests before it builds

jobs:
  fast:
    # The fast suite needs MLX (Apple silicon) and one tokenizer; model tests
    # (marked `model`) need cached weights and run locally: `pytest -m model`.
    runs-on: macos-14
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Tokenizer for the tests
        run: |
          python - <<'EOF'
          from huggingface_hub import snapshot_download
          snapshot_download("mlx-community/Qwen2.5-1.5B-Instruct-4bit",
                            allow_patterns=["*.json", "*.txt", "tokenizer*"])
          EOF
      - name: Fast tests
        shell: bash  # with pipefail: the step fails when pytest does
        run: python -m pytest tests -q -m "not model" -rfE 2>&1 | tee pytest.log
      - name: Failures as annotations
        # annotations show on the run's page to anyone; the logs and the job summary need a GitHub sign-in
        if: failure()
        run: |
          python - <<'EOF'
          import re
          log = open("pytest.log", errors="replace").read()
          esc = lambda s: s.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          for line in re.findall(r"^(?:FAILED|ERROR) .*$", log, re.M)[:8]:
              print(f"::error title=Fast tests on Python ${{ matrix.python }}::{esc(line)}")
          failures = log.split("= FAILURES =", 1)[-1] if "= FAILURES =" in log else log
          print(f"::error title=Last lines of the failures (Python ${{ matrix.python }})::{esc(failures[-6000:])}")
          EOF
      - name: Build the wheel
        run: |
          python -m build
          python -m pip install dist/*.whl --no-deps --force-reinstall
          python -c "import locals; print(locals.__version__)"
